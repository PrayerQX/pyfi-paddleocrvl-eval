[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finvl-eval"
version = "0.1.0"
description = "Domain document evaluation harness for PyFi and PaddleOCR-VL 1.5 experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0"]

[project.optional-dependencies]
paddleocr = ["paddleocr>=3.4.0"]
openai = ["openai>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
finvl-eval = "finvl_eval.runner:main"
finvl-sample-pyfi = "finvl_eval.sample_pyfi:main"
finvl-download-pyfi = "finvl_eval.download_pyfi:main"
finvl-audit-invalid = "finvl_eval.audit_invalid:main"

[tool.setuptools.packages.find]
where = ["src"]
